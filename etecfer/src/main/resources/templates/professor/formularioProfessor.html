<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Professor</title>
</head>
<body>

    <h1 style="text-align: center;">Cadastrar Professor</h1>

    <form th:action="@{/professores/salvar}" method="post" th:object="${professor}">

        <input type="hidden" th:field="*{idProfessor}" />
        <br>

        <label>Nome:</label>
        <input type="text" th:field="*{nomeProfessor}" />
        <br>

        <label>telefone:</label>
        <input type="text" th:field="*{telProfessor}" />
        <br>

        <label>cpf:</label>
        <input type="text" th:field="*{cpfProfessor}" />
        <br>

        <label>graduacao:</label>
        <input type="text" th:field="*{gradProfessor}" />
        <br>

        <input type="submit" value="Salvar" />

    </form>

</body>
</html>
